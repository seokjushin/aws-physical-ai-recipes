---
RecipeFormatVersion: "2020-01-25"
ComponentName: com.workshop.docker-build
ComponentVersion: "1.0.0"
ComponentDescription: "GR00T N1.6 Docker 이미지 ECR Pull (이미 있으면 스킵)"
ComponentPublisher: Custom
ComponentConfiguration:
  DefaultConfiguration:
    # NX1: shared edge repo (day2-shared EdgeInferenceRepo), per-user image tag.
    # setup-greengrass-nx1.sh substitutes the placeholders below at registration time.
    ecrRepo: "ECR_REPO_PLACEHOLDER"
    imageTag: "IMAGE_TAG_PLACEHOLDER"
    region: "us-east-1"
Manifests:
  - Platform:
      os: linux
      architecture: amd64
    Lifecycle:
      run:
        RequiresPrivilege: true
        Script: |
          set -e
          ECR_REPO="{configuration:/ecrRepo}"
          IMAGE_TAG="{configuration:/imageTag}"
          REGION="{configuration:/region}"
          FULL_IMAGE="${ECR_REPO}:${IMAGE_TAG}"
          ACCOUNT_ID=$(echo "$ECR_REPO" | cut -d. -f1)

          # NX1: the edge image lives at nx1/groot-edge-inference:<userId>. We check
          # for the full ECR image locally (it may already exist if the Day1 box that
          # runs Greengrass is the same box that built/pushed it in setup-greengrass-nx1.sh).
          if docker images --format '{{.Repository}}:{{.Tag}}' | grep -q "^${FULL_IMAGE}$"; then
            echo "Docker image already exists locally, skipping pull"
            exit 0
          fi

          echo "=== ECR Login & Pull ==="
          aws ecr get-login-password --region "$REGION" | \
            docker login --username AWS --password-stdin "${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
          docker pull "$FULL_IMAGE"
          # keep a stable local tag for any tooling that greps for groot-n16-inference
          docker tag "$FULL_IMAGE" "groot-n16-inference:${IMAGE_TAG}"
          echo "=== Pull complete ==="
        Timeout: 3600
