AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NX1 Day3 - NX1 pre-provisioning for Greengrass v2 edge deployment.
  The workshop setup-greengrass-workshop-N16.sh performs runtime self-provisioning
  (iot:*/greengrass:*/iam:Create* put-role-policy, --provision true), which NX1
  governance blocks. This template pre-creates the IoT/TES/IAM resources via
  CloudFormation (CloudFormationDeployer = admin) and grants the instance role only
  scoped permissions. An engineer then installs Greengrass with --provision false
  from an SSM shell and deploys the components.
  NOTE (DRAFT): the Greengrass core IoT policy / device-registration flow needs one
  live validation (see NOTES inline).
  Deploy with: --role-arn CloudFormationDeployer --tags doosan:owner=BEST_NX1
  --capabilities CAPABILITY_NAMED_IAM.

Parameters:
  UserId:
    Type: String
    AllowedPattern: '^[a-z0-9-]+$'
    Description: Participant identifier. Used for thing/group/role/ECR/S3 naming.
  InstanceRoleName:
    Type: String
    Default: ''
    Description: >
      IAM role name of the instance (usually the Day1 box) where Greengrass is
      installed, e.g. nx1-isaaclab-<UserId>-role. The GreengrassProvision managed
      policy is attached to this role. Leave empty to create the policy WITHOUT
      attaching it (when validating IoT/TES resources without a Day1 box).
      Attach later via attach-role-policy or update-stack.
  ModelArtifactBucket:
    Type: String
    Description: Model/recipe/artifact S3 bucket (TES role read scope), e.g. nx1-groot-<UserId>-<acct>.
    AllowedPattern: '^(nx1|dibh)-.+'
  EcrRepoPrefix:
    Type: String
    Default: nx1/groot
    Description: Inference container ECR repo prefix (nx1/* required).
  CredentialDurationSeconds:
    Type: Number
    Default: 3600
    MinValue: 900
    MaxValue: 43200
  IotDataKmsKeyArn:
    Type: String
    AllowedPattern: '^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/.+'
    Description: >
      ARN of the NX1 IoT Core data CMK (alias/bestnx1/iot/data). REQUIRED - no default,
      to avoid hardcoding an account-specific ARN in source. Resolve at deploy time:
      aws kms describe-key --key-id alias/bestnx1/iot/data --query KeyMetadata.Arn --output text
      The IoT registry is encrypted with this CMK, so IoT write actions
      (CreateKeysAndCertificate, AttachThingPrincipal, ...) require kms:Decrypt /
      GenerateDataKey on it. The key policy allows account-root delegation, so granting
      it in the instance role is sufficient (no key-policy change needed).

Conditions:
  AttachToInstanceRole: !Not [!Equals [!Ref InstanceRoleName, '']]

Resources:
  # ---------- [1] IoT Thing (Greengrass core device) ----------
  CoreThing:
    Type: AWS::IoT::Thing
    Properties:
      ThingName: !Sub nx1-groot-${UserId}

  # ---------- [2] IoT Thing Group (deployment target) ----------
  CoreThingGroup:
    Type: AWS::IoT::ThingGroup
    Properties:
      ThingGroupName: !Sub nx1-groot-${UserId}-group
  # NOTE: Thing-to-Group membership is not supported natively in CFN. Add it at
  #       install time with `aws iot add-thing-to-thing-group` (instance role has
  #       the permission), or target the deployment at the Thing ARN directly.

  # ---------- [3] IoT policy for the Greengrass core ----------
  # (Created by admin - Developer cannot iot:CreatePolicy.) Minimal GGv2 core policy
  # scoped to this core device's thing name, per the AWS minimal core-device policy:
  # https://docs.aws.amazon.com/greengrass/v2/developerguide/device-auth.html
  # NOTE: thing policy variables (iot:Connection.Thing.*) are NOT supported for
  #       core devices - the docs prescribe a thing-name wildcard instead.
  # NOTE: if an inference component publishes/subscribes to custom MQTT topics,
  #       add them here (Stage 2 recipe review). ZMQ:5555 is local and needs nothing.
  CoreIotPolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub nx1-groot-${UserId}-ggcore-policy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            # wildcard suffix: core uses thing-name#N as client id past 50 subscriptions
            Resource: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/nx1-groot-${UserId}*
          - Effect: Allow
            Action: [iot:Publish, iot:Receive]
            Resource:
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/nx1-groot-${UserId}/greengrass/health/json
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/nx1-groot-${UserId}/greengrassv2/health/json
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/nx1-groot-${UserId}/jobs/*
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/$aws/things/nx1-groot-${UserId}/shadow/*
          - Effect: Allow
            Action: iot:Subscribe
            Resource:
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/nx1-groot-${UserId}/jobs/*
              - !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/$aws/things/nx1-groot-${UserId}/shadow/*
          - Effect: Allow
            Action: iot:AssumeRoleWithCertificate
            Resource: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:rolealias/nx1-groot-${UserId}-tes
          - Effect: Allow
            Action:
              - greengrass:GetComponentVersionArtifact
              - greengrass:ResolveComponentCandidates
              - greengrass:GetDeploymentConfiguration
              - greengrass:ListThingGroupsForCoreDevice
            Resource: '*'   # these GGv2 data-plane actions do not support resource-level scoping

  # ---------- [4] per-user Token Exchange Role (TES) ----------
  # New per-user role instead of mutating the shared GreengrassTokenExchangeRole (db-best-nx1-core).
  TesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub nx1-groot-${UserId}-tes-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: credentials.iot.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: nx1-groot-tes
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ModelArtifactRead
                Effect: Allow
                Action: [s3:GetObject, s3:GetBucketLocation, s3:ListBucket]
                Resource:
                  - !Sub arn:aws:s3:::${ModelArtifactBucket}
                  - !Sub arn:aws:s3:::${ModelArtifactBucket}/*
              - Sid: EcrAuth
                Effect: Allow
                Action: [ecr:GetAuthorizationToken]
                Resource: '*'
              - Sid: EcrPullNx1
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepoPrefix}-*
              - Sid: ComponentLogs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/greengrass/*

  TesRoleAlias:
    Type: AWS::IoT::RoleAlias
    Properties:
      RoleAlias: !Sub nx1-groot-${UserId}-tes
      RoleArn: !GetAtt TesRole.Arn
      CredentialDurationSeconds: !Ref CredentialDurationSeconds

  # ---------- [5] Scoped Greengrass provision/deploy permissions for the instance role ----------
  # Replaces the broad IAM the workshop script used to self-grant via put-role-policy.
  # Never includes iam:PutRolePolicy/CreateRole (NX1 self-escalation is forbidden).
  GreengrassProvisionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub nx1-groot-${UserId}-gg-provision
      Roles: !If [AttachToInstanceRole, [!Ref InstanceRoleName], !Ref 'AWS::NoValue']   # empty = not attached
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # On install (--provision false): create cert keypair + wire thing/policy
          - Sid: GgInstallCert
            Effect: Allow
            Action:
              - iot:CreateKeysAndCertificate
              - iot:UpdateCertificate
              - iot:DescribeEndpoint
              - iot:AttachThingPrincipal
              - iot:AttachPolicy
              - iot:AddThingToThingGroup
              - iot:DescribeThing
            Resource: '*'   # CreateKeysAndCertificate/DescribeEndpoint do not support resource-level scoping
          # Register components + deploy (blocked under the Developer identity, so run via instance role)
          # NOTE: the IAM service prefix for Greengrass V2 is 'greengrass' (NOT 'greengrassv2'),
          #       even though the CLI namespace is `aws greengrassv2`. See
          #       service-authorization/latest/reference/list_awsiotgreengrassv2.html
          - Sid: GgDeploy
            Effect: Allow
            Action:
              - greengrass:CreateComponentVersion
              - greengrass:DescribeComponent
              - greengrass:ListComponents
              - greengrass:ListComponentVersions
              - greengrass:CreateDeployment
              - greengrass:ListDeployments
              - greengrass:ListEffectiveDeployments
              - greengrass:ListInstalledComponents
              - greengrass:ListCoreDevices
              - greengrass:GetCoreDevice
              - greengrass:GetDeployment
            Resource: '*'
          # greengrass:CreateDeployment (and Cancel/Delete) require these IoT Jobs
          # dependent actions per the service-authorization reference for GGv2.
          # Targeting a thing group also needs iot:DescribeThingGroup (verified live).
          - Sid: GgDeployIotJobDeps
            Effect: Allow
            Action:
              - iot:DescribeThingGroup
              - iot:DescribeJob
              - iot:CreateJob
              - iot:UpdateJob
              - iot:CancelJob
              - iot:DeleteThingShadow
              - iot:GetThingShadow
              - iot:UpdateThingShadow
              - iot:DescribeJobExecution
            Resource: '*'
          # Component recipe/artifact S3 read+write (instance uploads/downloads recipes)
          - Sid: GgArtifactS3
            Effect: Allow
            Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
            Resource:
              - !Sub arn:aws:s3:::${ModelArtifactBucket}
              - !Sub arn:aws:s3:::${ModelArtifactBucket}/*
          # Pass the TES role to Greengrass at install time
          - Sid: PassTesRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt TesRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: credentials.iot.amazonaws.com
          # The NX1 IoT registry is encrypted with a customer-managed CMK
          # (alias/bestnx1/iot/data). IoT write actions above (CreateKeysAndCertificate,
          # AttachThingPrincipal, AddThingToThingGroup, ...) fail with UnauthorizedException
          # / "Encryption/Decryption failed with Customer Managed Key" unless the caller can
          # use that key. The key policy delegates to account root, so granting it here is enough.
          - Sid: IotDataCmk
            Effect: Allow
            Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
            Resource: !Ref IotDataKmsKeyArn

Outputs:
  CoreThingName:
    Value: !Ref CoreThing
  ThingGroupName:
    Value: !Ref CoreThingGroup
  DeploymentTargetArn:
    Description: greengrassv2 create-deployment --target-arn
    Value: !Sub arn:aws:iot:${AWS::Region}:${AWS::AccountId}:thinggroup/nx1-groot-${UserId}-group
  TesRoleAliasName:
    Value: !Ref TesRoleAlias
  IotPolicyName:
    Value: !Ref CoreIotPolicy
  InstallHint:
    Description: How to install Greengrass against these resources (--provision false)
    Value: !Sub >-
      Run setup-greengrass-nx1.sh ${UserId} on the instance. It creates a device cert,
      attaches it to thing nx1-groot-${UserId} + policy nx1-groot-${UserId}-ggcore-policy,
      writes a config.yaml (thingName, iotRoleAlias nx1-groot-${UserId}-tes, data/cred
      endpoints from aws iot describe-endpoint), and runs the installer with
      --init-config config.yaml --provision false --setup-system-service true.
