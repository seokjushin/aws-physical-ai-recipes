AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NX1 Egress Probe (선행 게이트 F1/F2) — Appendix C 호스트 도달성 + TLS MITM 실측.
  private SubnetAppA에 t3.micro AL2023 인스턴스 1개를 띄워 UserData로 curl/openssl probe 실행.
  결과 회수: (1) SSM 등록 여부 = ssm/ssmmessages/ec2messages egress 신호,
  (2) /var/log/egress-probe.log + dibh 버킷 egress-probe/ 업로드. 검증 후 delete-stack.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0ba18fea83615b131
    Description: 공유 VPC (Networking 계정 소유) — SG 생성용
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0824e676b789f5f5d
    Description: SubnetAppA (private, NAT egress, us-east-1a)
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: AL2023 (SSM agent/curl/openssl/awscli 기본 포함)
  ReportBucket:
    Type: String
    Default: dibh-737138011740-us-east-1-cloudformation
    Description: probe 리포트 업로드 대상 버킷 (egress-probe/ prefix)

Resources:
  ProbeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NX1 egress probe - egress only, no inbound (Firewall Manager safe)
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: all egress via shared NAT to Cloud One
      Tags:
        - Key: Name
          Value: nx1-egress-probe-sg

  ProbeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReportUpload
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub arn:aws:s3:::${ReportBucket}/egress-probe/*
      Tags:
        - Key: Name
          Value: nx1-egress-probe-role

  ProbeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ProbeRole]

  ProbeInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds: [!Ref ProbeSecurityGroup]
      IamInstanceProfile: !Ref ProbeInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: nx1-egress-probe
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # cloud-init output -> /var/log/cloud-init-output.log + serial console
          REPORT=/var/log/egress-probe.log
          exec > >(tee "$REPORT") 2>&1
          echo "===== NX1 EGRESS PROBE START $(date -u) ====="
          echo "instance: $(curl -s http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null)"
          echo

          # HTTPS 도달성 테스트 (Appendix C 전체)
          HOSTS=(
            "https://ssm.${AWS::Region}.amazonaws.com"
            "https://ssmmessages.${AWS::Region}.amazonaws.com"
            "https://ec2messages.${AWS::Region}.amazonaws.com"
            "https://nvcr.io/v2/"
            "https://registry-1.docker.io/v2/"
            "https://nvidia.github.io"
            "https://huggingface.co"
            "https://cdn-lfs.huggingface.co"
            "https://pypi.org/simple/"
            "https://files.pythonhosted.org"
            "https://archive.ubuntu.com"
            "https://packages.ros.org"
            "https://raw.githubusercontent.com"
            "https://github.com"
            "https://d1uj6qtbmh3dt5.cloudfront.net"
            "https://dcv-license.${AWS::Region}.s3.amazonaws.com"
            "https://s3.amazonaws.com/cloudformation-examples/"
            "https://ws-assets-prod-iad-r-iad-ed37f6e827eef9bb.s3.us-east-1.amazonaws.com"
          )
          echo "----- HTTP REACHABILITY (curl, --max-time 20) -----"
          for url in "${!HOSTS[@]}"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$url" 2>/tmp/curlerr)
            rc=$?
            if [ "$rc" -ne 0 ]; then
              printf "%-70s FAIL(curl rc=%s) %s\n" "$url" "$rc" "$(head -c 120 /tmp/curlerr | tr '\n' ' ')"
            else
              printf "%-70s HTTP %s\n" "$url" "$code"
            fi
          done

          echo
          echo "----- TLS CERT ISSUER (MITM/Cloud One inspection 탐지) -----"
          TLS_HOSTS=( "ssm.${AWS::Region}.amazonaws.com" "huggingface.co" "nvcr.io" "registry-1.docker.io" "pypi.org" "github.com" )
          for h in "${!TLS_HOSTS[@]}"; do
            issuer=$(echo | timeout 20 openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null | openssl x509 -noout -issuer 2>/dev/null)
            printf "%-40s %s\n" "$h" "${!issuer:-UNREACHABLE/NO-CERT}"
          done

          echo
          echo "===== NX1 EGRESS PROBE END $(date -u) ====="

          # S3 업로드 (인스턴스 역할 PutObject; s3 egress 테스트 겸용)
          IID=$(curl -s http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null)
          aws s3 cp "$REPORT" "s3://${ReportBucket}/egress-probe/$IID.log" --region ${AWS::Region} \
            && echo "S3 UPLOAD OK -> s3://${ReportBucket}/egress-probe/$IID.log" \
            || echo "S3 UPLOAD FAILED (s3 egress 차단 가능)"

Outputs:
  InstanceId:
    Value: !Ref ProbeInstance
  ReportS3Prefix:
    Value: !Sub s3://${ReportBucket}/egress-probe/
  CheckSsmCmd:
    Description: SSM 등록 확인 (= ssm/ssmmessages/ec2messages egress 신호)
    Value: !Sub aws ssm describe-instance-information --filters Key=InstanceIds,Values=${ProbeInstance} --region ${AWS::Region} --profile BESTNX1-Developer-737138011740
