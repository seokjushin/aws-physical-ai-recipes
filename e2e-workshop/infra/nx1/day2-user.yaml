AWSTemplateFormatVersion: '2010-09-09'
Description: >
  NX1 Day2 PER-USER - GR00T fine-tune per-user 리소스 (Spec Appendix B).
  S3 아티팩트 버킷(nx1/*, BPA+암호화+버전) + SageMaker 실행롤 + per-user Notebook롤
  + 기존 Studio 도메인(d-evroaqdzfcor) user-profile + (옵션)MLflow. 변환 원본 groot-sagemaker-stack.ts.
  ⚠️ 제외: StudioDomain 생성(기존 재사용). deploy-endpoint Lambda는 포함(2026-06-05 NX1 거버넌스 검증 통과 - Pipeline DeployEndpoint LambdaStep 복원).
  ⚠️ F4: 기존 도메인은 SSO 인증 → user-profile에 IdC 사용자 매핑(SsoUserValue) 필요 가능(관리계정 의존).
  ⚠️ I1: 학습은 SageMaker Training Job을 --no-spot(On-Demand) + VpcConfig 미설정(Cloud One 우회)으로 실행.

Parameters:
  UserId:
    Type: String
    AllowedPattern: '^[a-z0-9-]+$'
    Description: Your participant ID (lowercase/digits/hyphen). Used as prefix for user-profile, S3 bucket, IAM roles.
  StudioDomainId:
    Type: String
    Default: d-evroaqdzfcor
    Description: Existing shared nx1 Studio domain. Keep default (no new domain created).
  SsoUserValue:
    Type: String
    Default: ''
    Description: Your full IdC UserName for SSO mapping (e.g. seokjus@doosan.com or ilhwang.cha@corp.doosan.com). Leave blank to auto-create on first Studio login.
  KmsKeyArn:
    Type: String
    Default: ''
    Description: Optional CMK ARN for S3 SSE-KMS. Leave blank to use SSE-S3 (AES256). Default is fine for the workshop.
  CreateMlflow:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Create per-user MLflow tracking server. Keep 'false' - the workshop uses the shared MLflow from nx1-groot-shared. Setting 'true' incurs duplicate hourly cost.
  TrainingRepoName:
    Type: String
    Default: nx1/groot-sm-training
    Description: Shared training ECR repo name from nx1-groot-shared. Keep default.

Conditions:
  UseCustomKms: !Not [!Equals [!Ref KmsKeyArn, '']]
  HasSso: !Not [!Equals [!Ref SsoUserValue, '']]
  WantMlflow: !Equals [!Ref CreateMlflow, 'true']

Resources:
  # ---------- [1] S3 아티팩트 버킷 (nx1/*, BPA+암호화+버전 - F7) ----------
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub nx1-groot-${UserId}-${AWS::AccountId}
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [UseCustomKms, 'aws:kms', 'AES256']
              KMSMasterKeyID: !If [UseCustomKms, !Ref KmsKeyArn, !Ref 'AWS::NoValue']
      LifecycleConfiguration:
        Rules:
          - Id: CleanupCheckpoints
            Status: Enabled
            Prefix: checkpoints/
            ExpirationInDays: 30
          - Id: ArchiveOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 365
            NoncurrentVersionTransitions:
              - StorageClass: GLACIER
                TransitionInDays: 90

  # ---------- [2] SageMaker 학습/추론 실행롤 ----------
  SageMakerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub nx1-GR00TSageMakerRole-${UserId}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: sagemaker.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: nx1-sm-exec
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Bucket
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub '${ArtifactsBucket.Arn}/*'
              - Sid: SsmGrootRead
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/groot/*
              - Sid: EcrPull
                Effect: Allow
                Action: [ecr:GetDownloadUrlForLayer, ecr:BatchGetImage, ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability]
                Resource: '*'
              - Sid: Mlflow
                Effect: Allow
                Action: [sagemaker-mlflow:*, sagemaker:DescribeMlflowTrackingServer]
                Resource: '*'
              # Pipeline DeployEndpoint LambdaStep is invoked under this role
              # (run_pipeline.py upserts/starts with aws.role_arn = this SageMakerRole).
              - Sid: InvokeDeployEndpointLambda
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:groot-deploy-endpoint-${UserId}
              - !If
                - UseCustomKms
                - Sid: KmsUse
                  Effect: Allow
                  Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                  Resource: !Ref KmsKeyArn
                - !Ref 'AWS::NoValue'
              # Studio domain enforces EBS encryption with the NX1 'NX1 - Data' KMS key.
              # Without these perms, creating a new JupyterLab space fails with
              # 'PermissionError: Unable to create EBS volume ... you don't have permissions to use the KMS key'.
              - Sid: StudioEbsKms
                Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey, kms:CreateGrant]
                Resource: arn:aws:kms:us-east-1:737138011740:key/a33a7909-6442-4007-bd3b-7e690d9f3ee2

  # ---------- [3] per-user Notebook 실행롤 (CDK-ism 제거 - B.1) ----------
  NotebookRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub nx1-GR00TNotebookRole-${UserId}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: sagemaker.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: nx1-notebook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3Bucket
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub '${ArtifactsBucket.Arn}/*'
              - Sid: CodeBuildManage
                Effect: Allow
                Action: [codebuild:StartBuild, codebuild:StopBuild, codebuild:BatchGetBuilds, codebuild:BatchGetProjects, codebuild:ListBuildsForProject]
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/groot-sm-*
              - Sid: EcrNx1
                Effect: Allow
                Action: [ecr:GetAuthorizationToken, ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage, ecr:DescribeRepositories, ecr:DescribeImages, ecr:ListImages]
                Resource: '*'
              - Sid: PassRoleToServices
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt SageMakerRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: [sagemaker.amazonaws.com, codebuild.amazonaws.com]
              - Sid: SsmGroot
                Effect: Allow
                Action: [ssm:GetParameter, ssm:GetParameters, ssm:PutParameter, ssm:DescribeParameters]
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/groot/*
              - Sid: MlflowAndLogs
                Effect: Allow
                Action: [sagemaker-mlflow:*, sagemaker:DescribeMlflowTrackingServer, sagemaker:CreatePresignedMlflowTrackingServerUrl, logs:DescribeLogGroups, logs:DescribeLogStreams, logs:GetLogEvents, logs:FilterLogEvents]
                Resource: '*'
              # Studio domain enforces EBS encryption with the NX1 'NX1 - Data' KMS key.
              # Without these perms, creating a new JupyterLab space fails with
              # 'PermissionError: Unable to create EBS volume ... you don't have permissions to use the KMS key'.
              - Sid: StudioEbsKms
                Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey, kms:CreateGrant]
                Resource: arn:aws:kms:us-east-1:737138011740:key/a33a7909-6442-4007-bd3b-7e690d9f3ee2

  # ---------- [4] CloudWatch Log Group (학습) ----------
  SageMakerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/sagemaker/groot-sm-${UserId}
      RetentionInDays: 30

  # ---------- [5] Studio user-profile - SSO 도메인 충돌로 제거 ----------
  # SSO-enabled Studio domain은 IdC 첫 로그인 시 user-profile을 자동생성하고
  # 같은 SSO UserName은 unique하게 한 user-profile에만 매핑됨. CFN으로 동일 SSO
  # UserName에 새 user-profile을 만들려고 하면 'AlreadyExists'.
  # → user-profile은 CFN으로 만들지 않고 IdC 자동생성분을 사용. 학습 launch는
  # Studio JupyterLab 터미널에서 boto3/CLI로 수행(2026-06-02 db-best-nx1-core IAM
  # 보강으로 EBS KMS·워크샵 리소스 접근 해소). SageMakerRole/NotebookRole은
  # 학습 잡이 PassRole로 받음.

  # ---------- [5b] deploy-endpoint Lambda (Pipeline DeployEndpoint LambdaStep) ----------
  # Restores the upstream LambdaStep path on NX1: Pipeline auto-deploys the SageMaker
  # Endpoint from the training artifact. NX1 governance verified (2026-06-05): Lambda +
  # IAM Role creation, PassRole(sagemaker), and non-VPC Lambda are all allowed for the
  # CloudFormationDeployer role (no SCP blocks). Without this the pipeline's DeployEndpoint
  # step has no function ARN; use run_pipeline.py --no-endpoint instead and deploy via
  # inference/sagemaker/deploy_endpoint.py.
  DeployEndpointLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub nx1-GR00TDeployEndpointRole-${UserId}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: nx1-deploy-endpoint
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SageMakerEndpointAndModel
                Effect: Allow
                Action:
                  - sagemaker:DescribeEndpoint
                  - sagemaker:DescribeEndpointConfig
                  - sagemaker:DeleteEndpoint
                  - sagemaker:DeleteEndpointConfig
                  - sagemaker:DeleteModel
                  - sagemaker:CreateModel
                  - sagemaker:CreateEndpointConfig
                  - sagemaker:CreateEndpoint
                  - sagemaker:AddTags
                Resource: '*'
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SageMakerRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: sagemaker.amazonaws.com

  DeployEndpointLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/groot-deploy-endpoint-${UserId}
      RetentionInDays: 30

  DeployEndpointLambda:
    Type: AWS::Lambda::Function
    DependsOn: DeployEndpointLogGroup
    Properties:
      FunctionName: !Sub groot-deploy-endpoint-${UserId}
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt DeployEndpointLambdaRole.Arn
      Timeout: 600
      MemorySize: 256
      Code:
        ZipFile: |
          # GR00T endpoint deploy Lambda (SageMaker Pipeline LambdaStep target).
          # cleanup existing endpoint -> create_model -> create_endpoint_config -> create_endpoint
          import time
          import boto3
          from botocore.exceptions import ClientError, WaiterError

          def _delete_existing_endpoint(sm, endpoint_name):
              try:
                  ep = sm.describe_endpoint(EndpointName=endpoint_name)
              except ClientError as e:
                  if "Could not find endpoint" in str(e) or "ValidationException" in str(e):
                      return {"action": "skipped", "reason": "endpoint_not_found"}
                  raise
              status = ep["EndpointStatus"]
              if status not in ("InService", "Failed"):
                  raise RuntimeError(
                      "Endpoint '%s' is in transient state '%s'; retry after it stabilizes."
                      % (endpoint_name, status))
              config_name = ep["EndpointConfigName"]
              model_name = None
              try:
                  cfg = sm.describe_endpoint_config(EndpointConfigName=config_name)
                  variants = cfg.get("ProductionVariants", [])
                  if variants:
                      model_name = variants[0].get("ModelName")
              except ClientError:
                  pass
              sm.delete_endpoint(EndpointName=endpoint_name)
              waiter = sm.get_waiter("endpoint_deleted")
              try:
                  waiter.wait(EndpointName=endpoint_name,
                              WaiterConfig={"Delay": 10, "MaxAttempts": 60})
              except WaiterError as e:
                  raise RuntimeError("endpoint_deleted waiter failed: %s" % e)
              try:
                  sm.delete_endpoint_config(EndpointConfigName=config_name)
              except ClientError:
                  pass
              if model_name:
                  try:
                      sm.delete_model(ModelName=model_name)
                  except ClientError:
                      pass
              return {"action": "deleted", "previous_config": config_name, "previous_model": model_name}

          def handler(event, context):
              region = event.get("region") or None
              sm = boto3.client("sagemaker", region_name=region) if region else boto3.client("sagemaker")
              endpoint_name = event["endpoint_name"]
              instance_type = event["instance_type"]
              model_data = event["model_data"]
              image_uri = event["image_uri"]
              role_arn = event["role_arn"]
              cleanup_result = _delete_existing_endpoint(sm, endpoint_name)
              timestamp = int(time.time())
              model_name = "%s-model-%d" % (endpoint_name, timestamp)
              config_name = "%s-%d" % (endpoint_name, timestamp)
              sm.create_model(
                  ModelName=model_name,
                  PrimaryContainer={"Image": image_uri, "ModelDataUrl": model_data},
                  ExecutionRoleArn=role_arn)
              sm.create_endpoint_config(
                  EndpointConfigName=config_name,
                  ProductionVariants=[{
                      "VariantName": "AllTraffic",
                      "ModelName": model_name,
                      "InstanceType": instance_type,
                      "InitialInstanceCount": 1,
                      "ModelDataDownloadTimeoutInSeconds": 3600,
                      "ContainerStartupHealthCheckTimeoutInSeconds": 1800,
                  }])
              sm.create_endpoint(EndpointName=endpoint_name, EndpointConfigName=config_name)
              return {
                  "statusCode": 200,
                  "endpoint_name": endpoint_name,
                  "model_name": model_name,
                  "endpoint_config_name": config_name,
                  "cleanup": cleanup_result,
              }

  # ---------- [6] (옵션) MLflow tracking server ----------
  MlflowTrackingServer:
    Type: AWS::SageMaker::MlflowTrackingServer
    Condition: WantMlflow
    DependsOn: ArtifactsBucket
    Properties:
      TrackingServerName: !Sub nx1-groot-mlflow-${UserId}
      ArtifactStoreUri: !Sub s3://nx1-groot-${UserId}-${AWS::AccountId}/mlflow-artifacts
      RoleArn: !GetAtt SageMakerRole.Arn
      TrackingServerSize: Small
      AutomaticModelRegistration: false

Outputs:
  BucketName:
    Value: !Ref ArtifactsBucket
  SageMakerRoleArn:
    Value: !GetAtt SageMakerRole.Arn
  NotebookRoleArn:
    Value: !GetAtt NotebookRole.Arn
  DeployEndpointArn:
    Description: Pipeline DeployEndpoint LambdaStep ARN. Put into config.yaml lambda.deploy_endpoint_arn
    Value: !GetAtt DeployEndpointLambda.Arn
  MlflowArn:
    Condition: WantMlflow
    Value: !GetAtt MlflowTrackingServer.TrackingServerArn
