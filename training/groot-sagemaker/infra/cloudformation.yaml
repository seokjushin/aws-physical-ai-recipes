AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GR00T-N1.6 SageMaker 파인튜닝 인프라 스택.
  S3 버킷, IAM 실행 역할, ECR 리포지토리, CodeBuild 프로젝트,
  SSM 파라미터, CloudWatch 로그 그룹을 생성합니다.

# =============================================================================
# Parameters
# =============================================================================
Parameters:
  BucketName:
    Type: String
    Description: GR00T 아티팩트 저장용 S3 버킷 이름 (전 세계 고유해야 함)
    AllowedPattern: "[a-z0-9][a-z0-9\\-]{2,61}[a-z0-9]"
    ConstraintDescription: "소문자, 숫자, 하이픈만 허용. 3-63자."

  Alias:
    Type: String
    Default: ""
    Description: >
      (선택) 리소스 이름 충돌 방지용 postfix. 비워두면 postfix 없이 기본 이름 사용.
      예: alias=alice → groot-n16-training-alice, GR00TSageMakerRole-alice
    AllowedPattern: "^$|^[a-zA-Z0-9][a-zA-Z0-9-]{0,30}$"
    ConstraintDescription: "비우거나, 영숫자/하이픈으로 시작, 1-31자."

  RoleName:
    Type: String
    Default: GR00TSageMakerRole
    Description: SageMaker 실행 역할 이름 (Alias 지정 시 postfix 추가)

  CodeBuildRoleName:
    Type: String
    Default: GR00TCodeBuildRole
    Description: CodeBuild 서비스 역할 이름 (Alias 지정 시 postfix 추가)

  NotebookRoleName:
    Type: String
    Default: GR00TNotebookRole
    Description: >
      SageMaker Notebook 인스턴스용 사용자 역할 이름.
      이 repo의 스크립트(deploy_stack, run_training, trigger_build,
      deploy_endpoint 등)를 노트북에서 실행할 때 사용 (Alias 지정 시 postfix 추가)

  MlflowTrackingServerSize:
    Type: String
    Default: Small
    AllowedValues: [Small, Medium, Large]
    Description: SageMaker managed MLflow tracking server 크기 (Small ≈ $0.642/hr).

  RepositoryUrl:
    Type: String
    Default: ""
    Description: >
      (선택) CodeBuild 소스용 GitHub/CodeCommit 리포지토리 URL.
      비워두면 NoSource 타입으로 생성됩니다 (로컬 zip 업로드 사용).

  DefaultVpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      SageMaker Studio 도메인이 ENI를 배치할 VPC.
      PublicInternetOnly 모드여도 CloudFormation은 VPC를 요구하므로,
      계정 기본 VPC 또는 임의의 VPC ID를 지정합니다.

  DefaultSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Studio 도메인용 서브넷 ID 목록 (1개 이상).
      DefaultVpcId 안의 서브넷이어야 합니다.

# =============================================================================
# Conditions
# =============================================================================
Conditions:
  HasRepositoryUrl: !Not [!Equals [!Ref RepositoryUrl, ""]]
  HasAlias: !Not [!Equals [!Ref Alias, ""]]

# =============================================================================
# Resources
# =============================================================================
Resources:

  # ---------------------------------------------------------------------------
  # S3 Bucket: 모델, 데이터셋, 학습 출력, 체크포인트 저장
  # ---------------------------------------------------------------------------
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveOldVersions
            Status: Enabled
            NoncurrentVersionTransitions:
              - StorageClass: GLACIER
                TransitionInDays: 90
            NoncurrentVersionExpirationInDays: 365
          - Id: CleanupCheckpoints
            Status: Enabled
            Prefix: checkpoints/
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: GR00T-N1.6

  # ---------------------------------------------------------------------------
  # IAM Role: SageMaker 실행 역할 (최소 권한)
  # ---------------------------------------------------------------------------
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If [HasAlias, !Sub "${RoleName}-${Alias}", !Ref RoleName]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: GR00TS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3BucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub "arn:aws:s3:::${BucketName}"
                  - !Sub "arn:aws:s3:::${BucketName}/*"
        - PolicyName: GR00TSSMAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SSMParamRead
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/groot/*"
        - PolicyName: GR00TECRAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRPull
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:GetAuthorizationToken
                Resource: "*"
        - PolicyName: GR00TMlflowAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MlflowTracking
                Effect: Allow
                Action:
                  - sagemaker-mlflow:*
                  - sagemaker:DescribeMlflowTrackingServer
                Resource: "*"
      Tags:
        - Key: Project
          Value: GR00T-N1.6

  # ---------------------------------------------------------------------------
  # ECR Repositories: 학습 / 추론 컨테이너 이미지
  # ---------------------------------------------------------------------------
  TrainingRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !If [HasAlias, !Sub "groot-n16-training-${Alias}", "groot-n16-training"]
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "최근 5개 이미지만 유지",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: GR00T-N1.6

  InferenceRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !If [HasAlias, !Sub "groot-n16-inference-${Alias}", "groot-n16-inference"]
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "최근 5개 이미지만 유지",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: GR00T-N1.6

  # ---------------------------------------------------------------------------
  # IAM Role: CodeBuild 서비스 역할
  # ---------------------------------------------------------------------------
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If [HasAlias, !Sub "${CodeBuildRoleName}-${Alias}", !Ref CodeBuildRoleName]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildECRAndLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRPush
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: "*"
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/groot-n16-*"
              - Sid: S3ForBuildSource
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${BucketName}/codebuild-source/*"

  # ---------------------------------------------------------------------------
  # IAM Role: SageMaker Notebook 인스턴스용 사용자 역할
  #   - 이 repo의 스크립트(deploy_stack, run_training, trigger_build,
  #     deploy_endpoint, invoke_endpoint 등)를 노트북에서 실행할 때 사용.
  #   - SageMaker / S3 FullAccess 부여 + CodeBuild, ECR, CloudFormation,
  #     IAM PassRole, SSM, CloudWatch Logs 권한 포함.
  # ---------------------------------------------------------------------------
  NotebookRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If [HasAlias, !Sub "${NotebookRoleName}-${Alias}", !Ref NotebookRoleName]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
      Policies:
        - PolicyName: GR00TNotebookCodeBuildAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CodeBuildManage
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:StopBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:BatchGetProjects
                  - codebuild:ListBuilds
                  - codebuild:ListBuildsForProject
                  - codebuild:ListProjects
                Resource: "*"
        - PolicyName: GR00TNotebookECRAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRFull
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                  - ecr:ListImages
                  - ecr:CreateRepository
                Resource: "*"
        - PolicyName: GR00TNotebookCloudFormationAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                Resource: "*"
        - PolicyName: GR00TNotebookIAMPassRole
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PassRoleForServices
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - sagemaker.amazonaws.com
                      - codebuild.amazonaws.com
              - Sid: IAMRead
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:ListRoles
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                Resource: "*"
        - PolicyName: GR00TNotebookSSMAndLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SSMParams
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:PutParameter
                  - ssm:DescribeParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/groot/*"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cdk-bootstrap/*"
              - Sid: CloudWatchLogsRead
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource: "*"
        - PolicyName: GR00TNotebookMlflowAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: MlflowFull
                Effect: Allow
                Action:
                  - sagemaker-mlflow:*
                  - sagemaker:CreateMlflowTrackingServer
                  - sagemaker:DeleteMlflowTrackingServer
                  - sagemaker:DescribeMlflowTrackingServer
                  - sagemaker:ListMlflowTrackingServers
                  - sagemaker:StartMlflowTrackingServer
                  - sagemaker:StopMlflowTrackingServer
                  - sagemaker:CreatePresignedMlflowTrackingServerUrl
                Resource: "*"
        - PolicyName: GR00TNotebookCDKAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CDKBootstrapAssumeRole
                Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/cdk-*"
              - Sid: CDKSTSIdentity
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"
      Tags:
        - Key: Project
          Value: GR00T-N1.6
        - Key: Purpose
          Value: SageMakerNotebook

  # ---------------------------------------------------------------------------
  # CodeBuild Projects: Docker 이미지 빌드 및 ECR 푸시
  # ---------------------------------------------------------------------------
  TrainingBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !If [HasAlias, !Sub "groot-n16-training-build-${Alias}", "groot-n16-training-build"]
      Description: GR00T-N1.6 학습 컨테이너 빌드 및 ECR 푸시
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true         # Docker in Docker 빌드 허용
        EnvironmentVariables:
          - Name: ECR_REGISTRY
            Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: IMAGE_REPO
            Value: !Ref TrainingRepository
          - Name: GROOT_VERSION
            Value: n1.6
          - Name: USE_STABLE
            Value: "true"
          - Name: BASE_MODEL_PATH
            Value: nvidia/GR00T-N1.6-3B
          - Name: IMAGE_TAG
            Value: latest
      Source:
        Type: !If [HasRepositoryUrl, GITHUB, NO_SOURCE]
        Location: !If [HasRepositoryUrl, !Ref RepositoryUrl, !Ref AWS::NoValue]
        BuildSpec: !If
          - HasRepositoryUrl
          - container/training/buildspec.yml
          - |
            version: 0.2
            phases:
              build:
                commands:
                  - echo "소스 없음: S3에서 소스를 업로드한 후 빌드를 트리거하세요."
      Artifacts:
        Type: NO_ARTIFACTS
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !If
            - HasAlias
            - !Sub "/aws/codebuild/groot-n16-training-build-${Alias}"
            - "/aws/codebuild/groot-n16-training-build"
      Tags:
        - Key: Project
          Value: GR00T-N1.6

  InferenceBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !If [HasAlias, !Sub "groot-n16-inference-build-${Alias}", "groot-n16-inference-build"]
      Description: GR00T-N1.6 추론 컨테이너 빌드 및 ECR 푸시
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ECR_REGISTRY
            Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: IMAGE_REPO
            Value: !Ref InferenceRepository
      Source:
        Type: !If [HasRepositoryUrl, GITHUB, NO_SOURCE]
        Location: !If [HasRepositoryUrl, !Ref RepositoryUrl, !Ref AWS::NoValue]
        BuildSpec: !If
          - HasRepositoryUrl
          - container/inference/buildspec.yml
          - |
            version: 0.2
            phases:
              build:
                commands:
                  - echo "소스 없음: S3에서 소스를 업로드한 후 빌드를 트리거하세요."
      Artifacts:
        Type: NO_ARTIFACTS
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !If
            - HasAlias
            - !Sub "/aws/codebuild/groot-n16-inference-build-${Alias}"
            - "/aws/codebuild/groot-n16-inference-build"
      Tags:
        - Key: Project
          Value: GR00T-N1.6

  # ---------------------------------------------------------------------------
  # SSM Parameters: 민감 정보 저장 (선택)
  # ---------------------------------------------------------------------------
  HuggingFaceTokenParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /groot/hf-token
      Type: String
      Value: "PLACEHOLDER_REPLACE_WITH_YOUR_HF_TOKEN"
      Description: HuggingFace API 토큰 (GR00T 모델 다운로드용)
      Tags:
        Project: GR00T-N1.6

  WandbApiKeyParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /groot/wandb-key
      Type: String
      Value: "PLACEHOLDER_REPLACE_WITH_YOUR_WANDB_KEY"
      Description: Weights & Biases API 키 (학습 추적용, 선택)
      Tags:
        Project: GR00T-N1.6

  # ---------------------------------------------------------------------------
  # CloudWatch Log Group: SageMaker 학습 로그
  # ---------------------------------------------------------------------------
  SageMakerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !If
        - HasAlias
        - !Sub "/aws/sagemaker/groot-n16-${Alias}"
        - "/aws/sagemaker/groot-n16"
      RetentionInDays: 30

  # ---------------------------------------------------------------------------
  # SageMaker Studio Domain: 학습 잡 / 파이프라인 / 모델 레지스트리 콘솔 모니터링
  #   - PublicInternetOnly 모드 (별도 NAT/VPC 엔드포인트 불필요)
  #   - IAM 인증 (콘솔 로그인 후 presigned URL 로 Studio 접근)
  #   - 기본 실행 역할은 NotebookRole 재사용
  # ---------------------------------------------------------------------------
  StudioDomain:
    Type: AWS::SageMaker::Domain
    Properties:
      DomainName: !If [HasAlias, !Sub "groot-n16-studio-${Alias}", "groot-n16-studio"]
      AuthMode: IAM
      AppNetworkAccessType: PublicInternetOnly
      VpcId: !Ref DefaultVpcId
      SubnetIds: !Ref DefaultSubnetIds
      DefaultUserSettings:
        ExecutionRole: !GetAtt NotebookRole.Arn
        StudioWebPortal: ENABLED
        DefaultLandingUri: "studio::"
      Tags:
        - Key: Project
          Value: GR00T-N1.6

  # ---------------------------------------------------------------------------
  # SageMaker managed MLflow tracking server
  #   - HF Trainer는 MLFLOW_TRACKING_URI가 설정되면 자동으로 metric/param/artifact를 로깅.
  #   - Tracking server URI는 ARN 형식: arn:aws:sagemaker:<region>:<acct>:mlflow-tracking-server/<name>
  #   - Always-on이므로 미사용 시 stop-mlflow-tracking-server로 정지하여 비용 절감.
  # ---------------------------------------------------------------------------
  MlflowTrackingServer:
    Type: AWS::SageMaker::MlflowTrackingServer
    Properties:
      TrackingServerName: !If [HasAlias, !Sub "groot-mlflow-${Alias}", "groot-mlflow"]
      ArtifactStoreUri: !Sub "s3://${BucketName}/mlflow-artifacts"
      RoleArn: !GetAtt SageMakerExecutionRole.Arn
      TrackingServerSize: !Ref MlflowTrackingServerSize
      AutomaticModelRegistration: false
      Tags:
        - Key: Project
          Value: GR00T-N1.6

  StudioUserProfile:
    Type: AWS::SageMaker::UserProfile
    Properties:
      DomainId: !GetAtt StudioDomain.DomainId
      UserProfileName: !If [HasAlias, !Sub "groot-${Alias}", "groot-default"]
      UserSettings:
        ExecutionRole: !GetAtt NotebookRole.Arn
      Tags:
        - Key: Project
          Value: GR00T-N1.6

# =============================================================================
# Outputs
# =============================================================================
Outputs:
  BucketName:
    Description: S3 버킷 이름
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub "${AWS::StackName}-BucketName"

  SageMakerRoleArn:
    Description: SageMaker 실행 역할 ARN
    Value: !GetAtt SageMakerExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SageMakerRoleArn"

  NotebookRoleArn:
    Description: SageMaker Notebook 인스턴스용 사용자 역할 ARN
    Value: !GetAtt NotebookRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-NotebookRoleArn"

  NotebookRoleName:
    Description: SageMaker Notebook 인스턴스용 사용자 역할 이름
    Value: !Ref NotebookRole

  TrainingRepositoryUri:
    Description: 학습 컨테이너 ECR URI
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${TrainingRepository}"
    Export:
      Name: !Sub "${AWS::StackName}-TrainingRepositoryUri"

  InferenceRepositoryUri:
    Description: 추론 컨테이너 ECR URI
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${InferenceRepository}"
    Export:
      Name: !Sub "${AWS::StackName}-InferenceRepositoryUri"

  TrainingBuildProjectName:
    Description: 학습 컨테이너 CodeBuild 프로젝트 이름
    Value: !Ref TrainingBuildProject

  InferenceBuildProjectName:
    Description: 추론 컨테이너 CodeBuild 프로젝트 이름
    Value: !Ref InferenceBuildProject

  TrainingRepositoryName:
    Description: 학습 컨테이너 ECR 리포지토리 이름
    Value: !Ref TrainingRepository

  InferenceRepositoryName:
    Description: 추론 컨테이너 ECR 리포지토리 이름
    Value: !Ref InferenceRepository

  Alias:
    Description: 리소스 이름 postfix (alias)
    Value: !Ref Alias

  StudioDomainId:
    Description: SageMaker Studio 도메인 ID
    Value: !GetAtt StudioDomain.DomainId
    Export:
      Name: !Sub "${AWS::StackName}-StudioDomainId"

  StudioDomainUrl:
    Description: SageMaker Studio 콘솔 URL (계정 콘솔에서 사용)
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/sagemaker/home?region=${AWS::Region}#/studio/${StudioDomain.DomainId}"

  StudioUserProfileName:
    Description: 기본 Studio 사용자 프로필 이름
    Value: !If [HasAlias, !Sub "groot-${Alias}", "groot-default"]

  MlflowTrackingServerArn:
    Description: SageMaker managed MLflow tracking server ARN (MLFLOW_TRACKING_URI로 사용)
    Value: !GetAtt MlflowTrackingServer.TrackingServerArn
    Export:
      Name: !Sub "${AWS::StackName}-MlflowTrackingServerArn"

  MlflowTrackingServerName:
    Description: MLflow tracking server 이름
    Value: !If [HasAlias, !Sub "groot-mlflow-${Alias}", "groot-mlflow"]
